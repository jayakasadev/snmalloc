[package]
name = "snmalloc-sys"
version = "0.7.5"
authors = ["schrodingerzhu <i@zhuyi.fan>"]
edition = "2021"
license = "MIT"
description = "rust raw bindings of snmalloc."
keywords = ["snmalloc", "allocator"]
categories = ["memory-management", "api-bindings"]
homepage = "https://github.com/microsoft/snmalloc"
repository = "https://github.com/microsoft/snmalloc"
build = "build.rs"
include = [
    "Cargo.toml",
    "build.rs",
    "src/**",
    "upstream/CMakeLists.txt",
    "upstream/src/**",
    "upstream/fuzzing/**",
    # Ships scripts/dump_branch_hints.py, so the published tarball can
    # regenerate the branch-hints JSON that snmalloc-tools reads.
    "upstream/scripts/**",
    # Ships the upstream cmake/ directory, so the bundled CMakeLists.txt can
    # `include(...)` snmalloc_pgo.cmake and run_coverage.cmake.  Without this,
    # `cargo package` drops the directory and building the published tarball
    # fails with `include could not find requested file: snmalloc_pgo.cmake`.
    "upstream/cmake/**",
]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
cc = { version = "1.0", optional = true }
cmake = { version = "0.1", optional = true }

[features]
default = ["build_cmake", "usewait-on-address"]
build_cc = ["cc"]
build_cmake = ["cmake"]
qemu = []
debug = []
android-lld = []
native-cpu = []
local_dynamic_tls = []
win8compat = []
usecxx17 = []
check = []
lto = []
notls = []
## Tiered allocator stats.  Each feature sets a CMake option; see
## snmalloc-sys/build.rs.
#
#   * `stats-basic` -- BASIC tier: frontend fast/slow path counters, backend
#                      commit/decommit accounting, largebuddy free-chunk
#                      histogram.  Sets `-DSNMALLOC_STATS_BASIC=ON`.
#   * `stats-full`  -- FULL tier: BASIC plus per-size-class and lifetime
#                      histograms.  Sets `-DSNMALLOC_STATS_FULL=ON`, which
#                      also enables BASIC.
#   * `stats`       -- alias for `stats-basic`.
stats = ["stats-basic"]
stats-basic = []
stats-full = ["stats-basic"]
usewait-on-address = []
libc-api = []
tracing = []
fuzzing = []
vendored-stl = []
check-loads = []
pageid = []
gwp-asan = []
profiling = []
profile-refill-sampling = ["profiling"]
profile-secondary-storage = ["profiling"]
profile-refill-secondary = [
    "profile-refill-sampling",
    "profile-secondary-storage",
]
